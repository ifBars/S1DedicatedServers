name: Investigate Game Archive Updates

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report investigations without creating issues'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: game-archive-investigations
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'ifBars/S1DedicatedServers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect archive revisions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python scripts/ci/archive_watch.py
